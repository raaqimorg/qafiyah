name: Images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-images:
    name: Discover images
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: List buildable services
        id: list
        run: echo "services=$(bun scripts/deploy/build-images.ts --list)" >> "$GITHUB_OUTPUT"

  images:
    name: Image (${{ matrix.service }})
    needs: discover-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover-images.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Free disk space
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${avail}G"
          if [ "$avail" -lt 20 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
            df -h --output=avail / | tail -1
          fi

      - name: Build
        run: bun scripts/deploy/build-images.ts ${{ matrix.service }}
