name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  HADOLINT_VERSION: 2.15.1
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker-phases: ${{ github.event_name == 'workflow_dispatch' && '["db","origin","stack"]' || steps.filter.outputs.changes }}

    steps:
      - name: Checkout code without the production dumps and avatars
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/avatars/
            !/data/db/*/
            /data/db/0000_default/

      - name: Pick the Docker phases the changed files affect
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            db:
              - &outside-every-docker-phase
                - "**"
                - "!*.md"
                - "!LICENSE"
                - "!**/AGENTS.md"
                - "!**/CLAUDE.md"
                - "!**/GEMINI.md"
                - "!docs/**"
                - "!data/LICENSE"
                - "!data/**/*.md"
                - "!data/db/keys.manifest"
                - "!data/db/[0-9]*_[0-9]*/**"
                - "!data/avatars/**"
                - "!secrets/**"
                - "!.sops.yaml"
                - "!.github/*"
                - "!.github/ISSUE_TEMPLATE/**"
                - "!.github/workflows/gitleaks.yml"
                - "!.github/workflows/images.yml"
                - "!.github/workflows/labeler.yml"
                - "!.claude/**"
                - "!.vscode/**"
                - "!.husky/**"
                - "!.gitleaksignore"
                - "!.mcp.json"
                - "!.ignore"
                - "!.oxlintrc.json"
                - "!.oxfmtrc.json"
                - "!.prettierrc.json"
                - "!.prettierignore"
                - "!knip.json"
                - "!.dependency-cruiser.cjs"
                - "!clippy.toml"
                - "!.squawk.toml"
                - "!.hadolint.yaml"
                - "!scripts/check/**"
              - "!apps/web/**"
              - "!apps/inspector/**"
              - "!apps/telemetry-proxy/**"
              - "!apps/edge-gateway/**"
              - "!apps/observability/**"
              - "!scripts/smoke/**"
            origin:
              - *outside-every-docker-phase
              - "!apps/inspector/**"
              - "!apps/telemetry-proxy/**"
              - "!apps/observability/**"
            stack:
              - *outside-every-docker-phase
              - "!apps/inspector/**"
              - "!apps/telemetry-proxy/**"

  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code without the production dumps and avatars
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/avatars/
            !/data/db/*/
            /data/db/0000_default/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install actionlint and hadolint
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          curl -fsSLo hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          sudo install -m 0755 actionlint hadolint /usr/local/bin/
          rm actionlint.tar.gz actionlint hadolint

      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Gate (everything but the Docker phases)
        run: bun run ci --no-docker

  docker:
    name: Docker (${{ matrix.phase }})
    needs: changes
    if: needs.changes.outputs.docker-phases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(needs.changes.outputs.docker-phases) }}

    steps:
      - name: Checkout code without the production dumps and avatars
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/avatars/
            !/data/db/*/
            /data/db/0000_default/

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Rust toolchain
        if: matrix.phase != 'stack'
        run: rustup toolchain install

      - name: Cache Rust builds
        if: matrix.phase != 'stack'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docker-${{ matrix.phase }}

      - name: Warm the dev stack so the smoke's startup wait covers only startup
        if: matrix.phase == 'origin'
        run: |
          ./scripts/dev/compose.sh up -d --wait db elasticsearch
          ./scripts/dev/compose.sh run --rm --no-deps search-indexer
          cargo build -p qafiyah-api

      - name: Docker phase (runs on the committed 100-poem sample, no secrets)
        run: bun run ci --phase ${{ matrix.phase }}

      - name: Show the dev server log
        if: failure() && matrix.phase == 'origin'
        run: cat /tmp/dev-server.log || true
