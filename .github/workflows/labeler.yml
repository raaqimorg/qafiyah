name: Labeler

on:
  pull_request_target:
    branches:
      - main
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  label:
    name: Label by changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply the component and topic labels matching .github/labeler.yml
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
