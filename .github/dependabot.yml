version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      types:
        patterns:
          - "@types/*"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxlint-*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "prettier-plugin-astro"
        versions: [">=1.0.0"]
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps,rust)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
