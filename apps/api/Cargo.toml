[package]
name = "qafiyah-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
base64 = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
qafiyah-corpus = { path = "../../crates/corpus" }
qafiyah-elasticsearch = { path = "../../crates/elasticsearch" }
serde = { version = "1", features = ["derive"] }
form_urlencoded = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
rand = "0.10"
thiserror = "2"
subtle = "2"
sha2 = "0.11"
unicode-normalization = "0.1"
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls",
] }
diesel = { version = "2.3", default-features = false, features = [
  "postgres_backend",
  "serde_json",
  "chrono",
  "32-column-tables",
] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool", "migrations"] }
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
diesel_migrations = { version = "2.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
async-trait = "0.1"
tower = { version = "0.5", features = ["timeout"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "test-util"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
