global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    scrape_native_histograms: true
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9464
        refresh_interval: 15s

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: elasticsearch
    static_configs:
      - targets: [elasticsearch-exporter:9114]

  - job_name: health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://api:8787/healthz]
        labels:
          service: api
      - targets: [http://web:8080/healthz]
        labels:
          service: web
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: containers
    metrics_path: /api/v0/component/prometheus.exporter.cadvisor.containers/metrics
    static_configs:
      - targets: [alloy:12345]

  - job_name: host
    metrics_path: /api/v0/component/prometheus.exporter.unix.host/metrics
    static_configs:
      - targets: [alloy:12345]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
