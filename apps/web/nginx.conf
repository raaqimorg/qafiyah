worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  charset utf-8;
  charset_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  server_tokens off;

  set_real_ip_from 172.28.0.0/24;
  set_real_ip_from 172.29.0.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  resolver 127.0.0.11 valid=5s ipv6=off;

  include /etc/nginx/nginx-bad-bots.conf;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  proxy_cache_path /var/cache/nginx/astro levels=1:2 keys_zone=astro:10m
                   max_size=1g inactive=24h use_temp_path=off;

  limit_req_zone $binary_remote_addr zone=webapi:10m rate=60r/m;
  limit_req_status 429;

  map $uri $skip_astro_cache {
    default 0;
    ~^/account 1;
    ~^/api/me 1;
    ~^/auth/ 1;
    /login 1;
  }

  server {
    listen 8080;
    server_name www.qafiyah.com;
    include /etc/nginx/nginx-security-headers.conf;
    include /etc/nginx/nginx-csp.conf;
    return 301 https://qafiyah.com$request_uri;
  }

  server {
    listen 8080;
    server_name api.qafiyah.com;

    include /etc/nginx/nginx-security-headers.conf;
    include /etc/nginx/nginx-csp-api.conf;

    client_max_body_size 1m;

    location ^~ /account {
      return 404;
    }

    location / {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp-api.conf;
      set $api_upstream api-backend:8787;
      proxy_pass http://$api_upstream;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header CF-Connecting-IP $remote_addr;
    }
  }

  server {
    listen 8080 default_server;
    server_name qafiyah.com;
    root /app/apps/web/dist/client;

    absolute_redirect off;
    error_page 429 @rate_limited;

    include /etc/nginx/nginx-security-headers.conf;
    include /etc/nginx/nginx-csp.conf;

    rewrite ^/(.+)/$ /$1 permanent;

    location = /healthz {
      access_log off;
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      default_type text/plain;
      return 200 "ok\n";
    }

    if ($bad_bot) { return 403; }

    if ($uri ~ "/[^/]{256,}") { return 414; }

    location ^~ /_astro/ {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri @astro;
    }

    location ~* \.(?:ttf|otf|woff2?|eot|png|jpe?g|gif|webp|avif|svg|ico)$ {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri @astro;
    }

    location ~* \.(?:webmanifest|json|txt)$ {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      add_header Cache-Control "public, max-age=300";
      try_files $uri @astro;
    }

    location ^~ /account {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      limit_req zone=webapi burst=30 nodelay;
      try_files $uri @astro;
    }

    location ^~ /api/me {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      limit_req zone=webapi burst=30 nodelay;
      try_files $uri @astro;
    }

    location ^~ /auth/ {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      limit_req zone=webapi burst=30 nodelay;
      try_files $uri @astro;
    }

    location ^~ /api/v1/ {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      limit_req zone=webapi burst=30 nodelay;
      try_files $uri @astro;
    }

    location / {
      try_files $uri @astro;
    }

    location @astro {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      proxy_pass http://127.0.0.1:4321;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header x-real-ip $remote_addr;
      proxy_cache astro;
      proxy_cache_key "$host$uri$is_args$args";
      proxy_no_cache $skip_astro_cache;
      proxy_cache_bypass $skip_astro_cache;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status;
    }

    location @rate_limited {
      include /etc/nginx/nginx-security-headers.conf;
      include /etc/nginx/nginx-csp.conf;
      add_header Cache-Control "no-store" always;
      add_header Retry-After "60" always;
      return 429;
    }
  }
}
