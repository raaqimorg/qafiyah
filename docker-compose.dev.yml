services:
  db:
    container_name: qafiyah-dev-db
    ports: !override
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5434}:5432"
    volumes: !override
      - db_data:/var/lib/postgresql
      - ./data/db/${DEV_DUMP:-0000_default}:/dumps/${DEV_DUMP:-0000_default}:ro
      - ./scripts/db/sql:/docker-entrypoint-initdb.d/sql:ro
      - ./scripts/db/init.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
      - ./scripts/db/accounts-init.sh:/docker-entrypoint-initdb.d/20-accounts.sh:ro
  api:
    container_name: qafiyah-dev-api
    build:
      network: default
    environment:
      TRUSTED_PROXIES: 172.26.0.0/24
  mcp:
    container_name: qafiyah-dev-mcp
    build:
      network: default
    environment:
      TRUSTED_PROXIES: 172.26.0.0/24
  web:
    container_name: qafiyah-dev-web
    build:
      network: default
  edge-gateway:
    container_name: qafiyah-dev-edge-gateway
    environment:
      SET_REAL_IP_FROM: 172.29.0.1
    ports: !override
      - "127.0.0.1:${DEV_EDGE_PORT:-8090}:8080"
  elasticsearch:
    container_name: qafiyah-dev-es
    ports: !override
      - "127.0.0.1:${DEV_ES_PORT:-9201}:9200"
    environment:
      ES_JAVA_OPTS: "-Xms1500m -Xmx1500m"
    mem_limit: 3g
  search-indexer:
    container_name: qafiyah-dev-search-indexer
    build:
      network: default
  db-monitor-role:
    container_name: qafiyah-dev-db-monitor-role
  postgres-exporter:
    container_name: qafiyah-dev-postgres-exporter
  elasticsearch-exporter:
    container_name: qafiyah-dev-elasticsearch-exporter
  blackbox-exporter:
    container_name: qafiyah-dev-blackbox-exporter
  prometheus:
    container_name: qafiyah-dev-prometheus
  loki:
    container_name: qafiyah-dev-loki
  alloy:
    container_name: qafiyah-dev-alloy
  grafana:
    container_name: qafiyah-dev-grafana
    ports: !override
      - "127.0.0.1:${DEV_GRAFANA_PORT:-3300}:3000"

volumes:
  db_data:
    name: qafiyah-dev-db-data
  es_data:
    name: qafiyah-dev-es-data
  prometheus_data:
    name: qafiyah-dev-prometheus-data
  loki_data:
    name: qafiyah-dev-loki-data
  alloy_data:
    name: qafiyah-dev-alloy-data
  web_assets:
    name: qafiyah-dev-web-assets

networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.0.0/24
  backend:
    ipam:
      config:
        - subnet: 172.26.0.0/24
